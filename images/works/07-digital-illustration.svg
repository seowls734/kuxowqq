<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1000" width="1800" height="1000">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9f0fa"/><stop offset=".6" stop-color="#d4e1f3"/><stop offset="1" stop-color="#c3d4ee"/></linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9c2e8"/><stop offset="1" stop-color="#d9e5f5"/></linearGradient>
    <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffffff" stop-opacity=".9"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <path id="star" d="M12 1.5c.5 5.6 4.9 10 10.5 10.5-5.6.5-10 4.9-10.5 10.5C11.5 16.9 7.1 12.5 1.5 12 7.1 11.5 11.5 7.1 12 1.5Z"/>
  </defs>
  <rect width="1800" height="1000" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="900" cy="400" r="330" fill="url(#sunGlow)"/>
  <circle cx="900" cy="400" r="160" fill="#ffffff" opacity=".95"/>
  <circle cx="900" cy="400" r="220" fill="none" stroke="#ffffff" stroke-width="2" opacity=".7"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity=".85">
    <rect x="420" y="250" width="240" height="40" rx="20"/>
    <rect x="480" y="222" width="140" height="44" rx="22"/>
    <rect x="1180" y="300" width="260" height="36" rx="18"/>
    <rect x="1250" y="274" width="120" height="40" rx="20"/>
  </g>

  <!-- stars -->
  <g fill="#ffffff">
    <use href="#star" transform="translate(560 150) scale(1.4)"/>
    <use href="#star" transform="translate(1240 170) scale(1)"/>
    <use href="#star" transform="translate(1330 120) scale(1.8)"/>
  </g>

  <!-- birds -->
  <g fill="none" stroke="#3e4555" stroke-width="3" stroke-linecap="round" opacity=".6">
    <path d="M1060 250q10-10 20 0q10-10 20 0"/>
    <path d="M1110 220q8-8 16 0q8-8 16 0"/>
    <path d="M1020 210q7-7 14 0q7-7 14 0"/>
  </g>

  <!-- mountains (back to front) -->
  <path d="M0 640L220 470 380 560 560 400 760 560 900 470 1060 580 1260 420 1440 560 1600 470 1800 600V1000H0z" fill="#b9cdea"/>
  <path d="M0 700L180 590 360 660 520 540 700 680 880 590 1040 690 1220 560 1400 680 1580 600 1800 690V1000H0z" fill="#8fb0de"/>
  <path d="M0 760L240 650 460 740 640 650 860 760 1060 670 1300 760 1520 680 1800 770V1000H0z" fill="#6f98d6"/>

  <!-- lake -->
  <rect y="780" width="1800" height="220" fill="url(#lake)"/>
  <g fill="#ffffff" opacity=".7">
    <rect x="800" y="800" width="200" height="6" rx="3"/>
    <rect x="830" y="822" width="140" height="6" rx="3"/>
    <rect x="860" y="844" width="80" height="6" rx="3"/>
    <rect x="884" y="866" width="32" height="5" rx="2.5"/>
  </g>

  <!-- front hills -->
  <path d="M0 860C200 800 380 820 560 870S900 930 1000 1000H0z" fill="#3f5a86"/>
  <path d="M1800 830C1600 790 1420 820 1280 880S1060 960 1000 1000H1800z" fill="#34405a"/>

  <!-- pines -->
  <g fill="#2b3140">
    <path d="M300 860l34-120 34 120z"/><rect x="330" y="858" width="8" height="20"/>
    <path d="M360 870l26-90 26 90z"/><rect x="383" y="868" width="6" height="16"/>
    <path d="M1460 850l38-140 38 140z"/><rect x="1494" y="848" width="8" height="22"/>
    <path d="M1520 862l28-100 28 100z"/><rect x="1545" y="860" width="6" height="16"/>
  </g>

  <!-- little house with warm window -->
  <g transform="translate(1310 820)">
    <path d="M0 40L40 6 80 40z" fill="#2b3140"/>
    <rect x="8" y="38" width="64" height="44" fill="#3e4555"/>
    <rect x="30" y="52" width="18" height="18" rx="2" fill="#f0d9a8"/>
  </g>
</svg>
