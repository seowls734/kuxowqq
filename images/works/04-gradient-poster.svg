<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1000" width="1800" height="1000">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f4f9"/><stop offset="1" stop-color="#e2e9f3"/></linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef3fb"/><stop offset=".55" stop-color="#c9d8ee"/><stop offset="1" stop-color="#9bb2dc"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
    <filter id="sh" x="-30%" y="-20%" width="160%" height="150%"><feDropShadow dx="0" dy="30" stdDeviation="34" flood-color="#2b3140" flood-opacity=".2"/></filter>
    <clipPath id="artClip"><rect x="686" y="136" width="428" height="600"/></clipPath>
  </defs>
  <rect width="1800" height="1000" fill="url(#wall)"/>
  <rect y="840" width="1800" height="160" fill="#dfe6f0"/>
  <rect y="838" width="1800" height="4" fill="#d3dce8"/>
  <ellipse cx="420" cy="420" rx="280" ry="280" fill="url(#glow)" opacity=".8"/>

  <!-- frame -->
  <g filter="url(#sh)">
    <rect x="660" y="110" width="480" height="652" rx="6" fill="#2b3140"/>
  </g>
  <rect x="672" y="122" width="456" height="628" fill="#ffffff"/>
  <rect x="686" y="136" width="428" height="600" fill="url(#art)"/>

  <g clip-path="url(#artClip)">
    <g filter="url(#blur)">
      <circle cx="760" cy="250" r="150" fill="#ffffff"/>
      <circle cx="1040" cy="330" r="170" fill="#6f98d6" opacity=".85"/>
      <circle cx="820" cy="560" r="190" fill="#b9aee0" opacity=".75"/>
      <circle cx="1080" cy="680" r="150" fill="#3f68ab" opacity=".8"/>
      <circle cx="720" cy="740" r="120" fill="#eef3fb"/>
    </g>
    <circle cx="900" cy="420" r="128" fill="none" stroke="#ffffff" stroke-width="2" opacity=".85"/>
    <circle cx="900" cy="420" r="84" fill="#ffffff" opacity=".22"/>
    <path d="M686 560c80-40 150-40 214 0s140 40 214 0" fill="none" stroke="#ffffff" stroke-width="2" opacity=".6"/>
    <rect x="720" y="672" width="130" height="10" rx="5" fill="#ffffff" opacity=".9"/>
    <rect x="720" y="692" width="80" height="8" rx="4" fill="#ffffff" opacity=".6"/>
    <rect x="1034" y="680" width="44" height="8" rx="4" fill="#ffffff" opacity=".6"/>
  </g>

  <!-- small side print -->
  <g transform="translate(-50 0)">
  <g filter="url(#sh)">
    <rect x="1220" y="430" width="200" height="270" rx="4" fill="#ffffff"/>
  </g>
  <rect x="1236" y="446" width="168" height="200" fill="#eef3fb"/>
  <circle cx="1320" cy="546" r="52" fill="#9bbbe8"/>
  <circle cx="1346" cy="520" r="26" fill="#ffffff" opacity=".8"/>
  <rect x="1236" y="662" width="90" height="8" rx="4" fill="#3e4555"/>
  <rect x="1236" y="678" width="56" height="6" rx="3" fill="#aab6c8"/>

  </g>
  <!-- ledge shadow -->
  <ellipse cx="900" cy="852" rx="300" ry="10" fill="#2b3140" opacity=".06"/>
</svg>
