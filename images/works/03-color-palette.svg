<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1000" width="1800" height="1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f8fb"/><stop offset="1" stop-color="#e6ecf5"/></linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#6f98d6" opacity=".12"/></pattern>
    <filter id="sh" x="-40%" y="-20%" width="180%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#2b3140" flood-opacity=".16"/></filter>
    <g id="chip">
      <rect x="-80" y="-520" width="160" height="470" rx="18" fill="#ffffff"/>
    </g>
  </defs>
  <rect width="1800" height="1000" fill="url(#bg)"/>
  <rect width="1800" height="1000" fill="url(#dots)"/>

  <!-- left: overlapping color circles -->
  <g opacity=".95">
    <circle cx="420" cy="380" r="120" fill="#9bbbe8" opacity=".75"/>
    <circle cx="510" cy="470" r="120" fill="#bccdc3" opacity=".75"/>
    <circle cx="400" cy="520" r="120" fill="#e3c5be" opacity=".7"/>
  </g>
  <circle cx="330" cy="770" r="10" fill="#2b3140"/>
  <circle cx="370" cy="770" r="10" fill="#6f98d6"/>
  <circle cx="410" cy="770" r="10" fill="#bccdc3"/>
  <circle cx="450" cy="770" r="10" fill="#e3c5be"/>
  <circle cx="490" cy="770" r="10" fill="#e4d5bc"/>

  <!-- right: small illustration (arches & leaf) -->
  <g transform="translate(1330 230)">
    <rect x="0" y="0" width="260" height="360" rx="130" fill="#dfe8f5"/>
    <path d="M30 360V160a100 100 0 0 1 200 0v200z" fill="#9bbbe8"/>
    <path d="M70 360V200a60 60 0 0 1 120 0v160z" fill="#4f7cc2"/>
    <circle cx="196" cy="86" r="30" fill="#e4d5bc"/>
    <path d="M60 330c10-90 60-150 150-180-30 80-80 140-150 180z" fill="#5d7769" opacity=".9"/>
    <path d="M60 330c40-60 80-110 150-180" fill="none" stroke="#f5f8fc" stroke-width="3"/>
  </g>
  <rect x="1330" y="630" width="160" height="12" rx="6" fill="#3e4555"/>
  <rect x="1330" y="654" width="110" height="10" rx="5" fill="#aab6c8"/>

  <!-- fan of swatch chips, pivot at (900, 860) -->
  <g transform="translate(900 860)">
    <g transform="rotate(-26)" filter="url(#sh)">
      <use href="#chip"/>
      <rect x="-68" y="-508" width="136" height="90" rx="10" fill="#f4eee3"/>
      <rect x="-68" y="-412" width="136" height="90" rx="10" fill="#e4d5bc"/>
      <rect x="-68" y="-316" width="136" height="90" rx="10" fill="#c9b28c"/>
      <rect x="-68" y="-220" width="136" height="90" rx="10" fill="#8e7a59"/>
      <rect x="-68" y="-110" width="80" height="10" rx="5" fill="#3e4555"/><rect x="-68" y="-90" width="50" height="8" rx="4" fill="#aab6c8"/>
    </g>
    <g transform="rotate(-13)" filter="url(#sh)">
      <use href="#chip"/>
      <rect x="-68" y="-508" width="136" height="90" rx="10" fill="#f3e6e3"/>
      <rect x="-68" y="-412" width="136" height="90" rx="10" fill="#e3c5be"/>
      <rect x="-68" y="-316" width="136" height="90" rx="10" fill="#c99d93"/>
      <rect x="-68" y="-220" width="136" height="90" rx="10" fill="#9a6f66"/>
      <rect x="-68" y="-110" width="80" height="10" rx="5" fill="#3e4555"/><rect x="-68" y="-90" width="50" height="8" rx="4" fill="#aab6c8"/>
    </g>
    <g transform="rotate(0)" filter="url(#sh)">
      <use href="#chip"/>
      <rect x="-68" y="-508" width="136" height="90" rx="10" fill="#e5ede8"/>
      <rect x="-68" y="-412" width="136" height="90" rx="10" fill="#bccdc3"/>
      <rect x="-68" y="-316" width="136" height="90" rx="10" fill="#8fa89a"/>
      <rect x="-68" y="-220" width="136" height="90" rx="10" fill="#5d7769"/>
      <rect x="-68" y="-110" width="80" height="10" rx="5" fill="#3e4555"/><rect x="-68" y="-90" width="50" height="8" rx="4" fill="#aab6c8"/>
    </g>
    <g transform="rotate(13)" filter="url(#sh)">
      <use href="#chip"/>
      <rect x="-68" y="-508" width="136" height="90" rx="10" fill="#eef1f5"/>
      <rect x="-68" y="-412" width="136" height="90" rx="10" fill="#c8cfd9"/>
      <rect x="-68" y="-316" width="136" height="90" rx="10" fill="#8a94a6"/>
      <rect x="-68" y="-220" width="136" height="90" rx="10" fill="#3e4555"/>
      <rect x="-68" y="-110" width="80" height="10" rx="5" fill="#3e4555"/><rect x="-68" y="-90" width="50" height="8" rx="4" fill="#aab6c8"/>
    </g>
    <g transform="rotate(26)" filter="url(#sh)">
      <use href="#chip"/>
      <rect x="-68" y="-508" width="136" height="90" rx="10" fill="#dbe7f7"/>
      <rect x="-68" y="-412" width="136" height="90" rx="10" fill="#9bbbe8"/>
      <rect x="-68" y="-316" width="136" height="90" rx="10" fill="#6f98d6"/>
      <rect x="-68" y="-220" width="136" height="90" rx="10" fill="#4f7cc2"/>
      <rect x="-68" y="-110" width="80" height="10" rx="5" fill="#3e4555"/><rect x="-68" y="-90" width="50" height="8" rx="4" fill="#aab6c8"/>
    </g>
    <circle cx="0" cy="-70" r="12" fill="#ffffff" stroke="#c9d8ee" stroke-width="4"/>
  </g>
</svg>
