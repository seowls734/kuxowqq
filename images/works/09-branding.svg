<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1000" width="1800" height="1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef2f8"/><stop offset="1" stop-color="#dbe4f1"/></linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9bbbe8"/><stop offset="1" stop-color="#4f7cc2"/></linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#6f98d6" opacity=".13"/></pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#2b3140" flood-opacity=".18"/></filter>
    <path id="star" d="M12 1.5c.5 5.6 4.9 10 10.5 10.5-5.6.5-10 4.9-10.5 10.5C11.5 16.9 7.1 12.5 1.5 12 7.1 11.5 11.5 7.1 12 1.5Z"/>
  </defs>
  <rect width="1800" height="1000" fill="url(#bg)"/>
  <rect width="1800" height="1000" fill="url(#dots)"/>

  <!-- letterhead -->
  <g transform="rotate(-6 640 500)">
    <g filter="url(#sh)"><rect x="470" y="170" width="380" height="540" rx="6" fill="#ffffff"/></g>
    <circle cx="520" cy="226" r="20" fill="url(#mark)"/>
    <use href="#star" fill="#ffffff" transform="translate(520 226) scale(1.1) translate(-12 -12)"/>
    <rect x="550" y="218" width="90" height="10" rx="5" fill="#2b3140"/>
    <rect x="550" y="234" width="60" height="6" rx="3" fill="#aab6c8"/>
    <rect x="500" y="300" width="140" height="8" rx="4" fill="#3e4555"/>
    <g fill="#d3dae5">
      <rect x="500" y="336" width="320" height="7" rx="3.5"/><rect x="500" y="354" width="300" height="7" rx="3.5"/><rect x="500" y="372" width="316" height="7" rx="3.5"/><rect x="500" y="390" width="240" height="7" rx="3.5"/>
      <rect x="500" y="424" width="320" height="7" rx="3.5"/><rect x="500" y="442" width="290" height="7" rx="3.5"/><rect x="500" y="460" width="200" height="7" rx="3.5"/>
    </g>
    <rect x="500" y="520" width="80" height="8" rx="4" fill="#3e4555"/>
    <rect x="470" y="680" width="380" height="30" fill="#2b3140"/>
    <rect x="500" y="692" width="120" height="6" rx="3" fill="#9bbbe8"/>
  </g>

  <!-- business cards -->
  <g transform="rotate(8 1080 560)">
    <g filter="url(#sh)"><rect x="900" y="470" width="340" height="200" rx="12" fill="#2b3140"/></g>
    <circle cx="1070" cy="545" r="34" fill="url(#mark)"/>
    <use href="#star" fill="#ffffff" transform="translate(1070 545) scale(1.9) translate(-12 -12)"/>
    <rect x="1020" y="600" width="100" height="10" rx="5" fill="#ffffff"/>
    <rect x="1040" y="618" width="60" height="6" rx="3" fill="#9bbbe8"/>
  </g>
  <g transform="rotate(-4 1080 400)">
    <g filter="url(#sh)"><rect x="910" y="300" width="340" height="200" rx="12" fill="#ffffff"/></g>
    <circle cx="960" cy="350" r="18" fill="url(#mark)"/>
    <use href="#star" fill="#ffffff" transform="translate(960 350) translate(-12 -12)"/>
    <rect x="940" y="420" width="140" height="12" rx="6" fill="#2b3140"/>
    <rect x="940" y="442" width="90" height="7" rx="3.5" fill="#6f98d6"/>
    <rect x="940" y="464" width="120" height="6" rx="3" fill="#c6cfdb"/>
    <rect x="1150" y="464" width="70" height="6" rx="3" fill="#c6cfdb"/>
    <rect x="1234" y="300" width="16" height="200" fill="#9bbbe8"/>
  </g>

  <!-- round sticker -->
  <g filter="url(#sh)"><circle cx="1330" cy="250" r="78" fill="#ffffff"/></g>
  <circle cx="1330" cy="250" r="60" fill="none" stroke="#c9d8ee" stroke-width="2" stroke-dasharray="4 6"/>
  <circle cx="1330" cy="250" r="34" fill="url(#mark)"/>
  <use href="#star" fill="#ffffff" transform="translate(1330 250) scale(1.9) translate(-12 -12)"/>

  <!-- color system -->
  <g filter="url(#sh)"><rect x="860" y="760" width="460" height="110" rx="20" fill="#ffffff"/></g>
  <circle cx="916" cy="815" r="30" fill="#2b3140"/>
  <circle cx="990" cy="815" r="30" fill="#4f7cc2"/>
  <circle cx="1064" cy="815" r="30" fill="#9bbbe8"/>
  <circle cx="1138" cy="815" r="30" fill="#e4edf9" stroke="#dfe5ee"/>
  <rect x="1190" y="796" width="100" height="12" rx="6" fill="#3e4555"/>
  <rect x="1190" y="818" width="70" height="8" rx="4" fill="#aab6c8"/>

  <!-- type specimen -->
  <text x="470" y="860" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="120" fill="#6f98d6" opacity=".9">Aa</text>
  <rect x="640" y="800" width="120" height="10" rx="5" fill="#3e4555"/>
  <rect x="640" y="822" width="80" height="8" rx="4" fill="#aab6c8"/>
</svg>
