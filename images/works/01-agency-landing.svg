<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1000" width="1800" height="1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f8fc"/><stop offset="1" stop-color="#e3ebf7"/></linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c3d6f1"/><stop offset="1" stop-color="#4f7cc2"/></linearGradient>
    <linearGradient id="stand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d3dbe7"/><stop offset="1" stop-color="#bcc7d8"/></linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#6f98d6" opacity=".14"/></pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#4f7cc2" flood-opacity=".22"/></filter>
    <filter id="sh2" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2b3140" flood-opacity=".14"/></filter>
    <clipPath id="screen"><rect x="440" y="140" width="920" height="540" rx="10"/></clipPath>
  </defs>
  <rect width="1800" height="1000" fill="url(#bg)"/>
  <rect width="1800" height="1000" fill="url(#dots)"/>
  <circle cx="1540" cy="170" r="260" fill="#dfe8f5" opacity=".7"/>
  <circle cx="230" cy="860" r="220" fill="#e4edf9" opacity=".8"/>

  <!-- stand -->
  <path d="M845 700h110l26 168H819z" fill="url(#stand)"/>
  <rect x="740" y="862" width="320" height="18" rx="9" fill="#b3bfd2"/>
  <ellipse cx="900" cy="892" rx="230" ry="10" fill="#2b3140" opacity=".08"/>

  <!-- monitor -->
  <g filter="url(#sh)">
    <rect x="420" y="120" width="960" height="600" rx="26" fill="#2b3140"/>
  </g>
  <rect x="440" y="140" width="920" height="540" rx="10" fill="#ffffff"/>

  <g clip-path="url(#screen)">
