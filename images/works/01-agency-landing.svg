    <rect x="1092" y="178" width="46" height="8" rx="4" fill="#aab6c8"/>
    <rect x="1196" y="166" width="124" height="32" rx="16" fill="#2b3140"/>
    <rect x="1222" y="178" width="72" height="8" rx="4" fill="#ffffff" opacity=".9"/>
    <rect x="440" y="220" width="920" height="1" fill="#e6ebf2"/>

    <!-- hero text -->
    <rect x="490" y="262" width="118" height="10" rx="5" fill="#6f98d6"/>
    <rect x="490" y="290" width="380" height="36" rx="9" fill="#2b3140"/>
    <rect x="490" y="338" width="318" height="36" rx="9" fill="#2b3140"/>
    <rect x="490" y="386" width="246" height="36" rx="9" fill="#6f98d6"/>
    <rect x="490" y="448" width="330" height="10" rx="5" fill="#c6cfdb"/>
    <rect x="490" y="468" width="300" height="10" rx="5" fill="#c6cfdb"/>
    <rect x="490" y="488" width="210" height="10" rx="5" fill="#c6cfdb"/>
    <rect x="490" y="528" width="152" height="46" rx="23" fill="#4f7cc2"/>
    <rect x="518" y="547" width="96" height="9" rx="4.5" fill="#ffffff"/>
    <rect x="658" y="528" width="134" height="46" rx="23" fill="none" stroke="#2b3140" stroke-width="2"/>
    <rect x="686" y="547" width="78" height="9" rx="4.5" fill="#2b3140"/>

    <!-- hero art -->
    <circle cx="1150" cy="370" r="196" fill="none" stroke="#dfe8f5" stroke-width="2"/>
    <circle cx="1150" cy="370" r="140" fill="url(#orb)"/>
    <rect x="976" y="408" width="128" height="128" rx="28" fill="#e4edf9" opacity=".92" transform="rotate(-12 1040 472)"/>
    <circle cx="1268" cy="250" r="22" fill="#2b3140"/>
    <path d="M12 1.5c.5 5.6 4.9 10 10.5 10.5-5.6.5-10 4.9-10.5 10.5C11.5 16.9 7.1 12.5 1.5 12 7.1 11.5 11.5 7.1 12 1.5Z" fill="#ffffff" transform="translate(1150 300) scale(3) translate(-12 -12)"/>
    <g filter="url(#sh2)">
      <rect x="1060" y="470" width="226" height="96" rx="18" fill="#ffffff"/>
    </g>
    <circle cx="1100" cy="518" r="20" fill="#e4edf9"/>
    <path d="M1090 518l7 7 14-14" fill="none" stroke="#4f7cc2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1132" y="502" width="120" height="10" rx="5" fill="#2b3140"/>
    <rect x="1132" y="522" width="86" height="8" rx="4" fill="#c6cfdb"/>

    <!-- services -->
    <rect x="490" y="616" width="262" height="120" rx="16" fill="#f2f5fa"/>
    <rect x="770" y="616" width="262" height="120" rx="16" fill="#f2f5fa"/>
    <rect x="1050" y="616" width="262" height="120" rx="16" fill="#2b3140"/>
    <circle cx="526" cy="650" r="16" fill="#dfe8f5"/>
    <circle cx="806" cy="650" r="16" fill="#dfe8f5"/>
    <circle cx="1086" cy="650" r="16" fill="#4f7cc2"/>
    <rect x="556" y="644" width="120" height="10" rx="5" fill="#3e4555"/>
    <rect x="836" y="644" width="104" height="10" rx="5" fill="#3e4555"/>
    <rect x="1116" y="644" width="112" height="10" rx="5" fill="#ffffff"/>
