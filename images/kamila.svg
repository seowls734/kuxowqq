<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 650" role="img" aria-label="Kamilla">
  <defs>
    <style>
      .hair{fill:#3a2219}.hair-dk{fill:#29170f}.skin{fill:#f5dac6}.skin-dk{fill:#e7c1a8}
      .line{fill:none;stroke:#24140d;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="182" cy="632" rx="120" ry="10" fill="#9bbbe8" opacity=".25"/>

  <!-- back hair (to shoulder blades, light cascade ends) -->
  <path class="hair-dk" d="M180 48C110 48 64 96 66 176c2 64-6 124-2 194l12-14 10 28 13-22 12 18 8-20h122l8 20 12-18 13 22 10-28 12 14c4-70-4-130-2-194 2-80-44-128-114-128Z"/>

  <!-- jeans -->
  <path d="M98 462h80l-6 136H102Z" fill="#a9bdd3"/>
  <path d="M182 462h80l2 136h-72Z" fill="#a9bdd3"/>
  <path d="M120 470l-2 108M244 470l2 108" fill="none" stroke="#97acc4" stroke-width="2" stroke-linecap="round"/>
  <rect x="98" y="582" width="78" height="22" rx="4" fill="#c3d1e1"/>
  <rect x="188" y="582" width="78" height="22" rx="4" fill="#c3d1e1"/>

  <!-- sneakers -->
  <path d="M94 606h82c6 0 8 8 6 14-2 6-6 8-12 8H96c-8 0-12-6-10-12 1-6 4-10 8-10Z" fill="#fff" stroke="#d3dbe7" stroke-width="2"/>
  <path d="M186 606h82c4 0 7 4 8 10 2 6-2 12-10 12h-74c-6 0-10-2-12-8-2-6 0-14 6-14Z" fill="#fff" stroke="#d3dbe7" stroke-width="2"/>
  <path d="M112 612l22 8M206 612l22 8" stroke="#6f98d6" stroke-width="5" stroke-linecap="round"/>

  <!-- neck -->
  <rect x="160" y="245" width="40" height="52" rx="12" class="skin-dk"/>

  <!-- sweater -->
  <path d="M128 290c22-10 82-10 104 0 26 10 36 38 40 90l6 92H82l6-92c4-52 14-80 40-90Z" fill="#9bbbe8"/>
  <path d="M84 452h192v22H84Z" fill="#88abe0"/>
  <path d="M150 288q30 22 60 0" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/>

  <!-- arms (sleeves) -->
  <path d="M104 320c-16 40-10 74 40 86" fill="none" stroke="#88abe0" stroke-width="34" stroke-linecap="round"/>
  <path d="M256 320c16 40 10 74-36 82" fill="none" stroke="#88abe0" stroke-width="34" stroke-linecap="round"/>

  <!-- sketchbook -->
  <g transform="rotate(-6 200 400)">
    <rect x="140" y="352" width="118" height="88" rx="6" fill="#4f7cc2"/>
    <rect x="146" y="356" width="108" height="80" rx="4" fill="#fffaf1"/>
    <path d="M146 362h108" stroke="#c9d8ee" stroke-width="2"/>
    <path d="M186 404c-10-8-14-14-14-20a8 8 0 0 1 14-4 8 8 0 0 1 14 4c0 6-4 12-14 20Z" fill="none" stroke="#f4a6a0" stroke-width="3" stroke-linejoin="round"/>
    <path d="M214 378l3 7 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1Z" fill="#ffd66b"/>
    <path d="M160 420q20-8 40 0t40 0" fill="none" stroke="#9bbbe8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- hands -->
  <ellipse cx="150" cy="408" rx="15" ry="13" class="skin"/>
  <ellipse cx="226" cy="402" rx="15" ry="13" class="skin"/>

  <!-- ears -->
  <ellipse cx="87" cy="186" rx="14" ry="18" class="skin-dk"/>
  <ellipse cx="273" cy="186" rx="14" ry="18" class="skin-dk"/>
  <circle cx="86" cy="206" r="4" fill="#6f98d6"/>
  <circle cx="274" cy="206" r="4" fill="#6f98d6"/>

  <!-- face -->
  <path class="skin" d="M86 172c0-60 44-88 94-88s94 28 94 88c0 56-40 92-94 92s-94-36-94-92Z"/>

  <!-- blush -->
  <ellipse cx="117" cy="222" rx="19" ry="10" fill="#f4a6a0" opacity=".55"/>
  <ellipse cx="243" cy="222" rx="19" ry="10" fill="#f4a6a0" opacity=".55"/>

  <!-- eyes: brown, a bit larger than medium, soft almond shape -->
  <g>
    <ellipse cx="140" cy="188" rx="27" ry="22" fill="#fff"/>
    <circle cx="135" cy="190" r="17" fill="#6b3d22"/>
    <circle cx="135" cy="190" r="9" fill="#24140d"/>
    <circle cx="129" cy="183" r="4.5" fill="#fff"/>
    <circle cx="141" cy="196" r="2" fill="#fff"/>
    <path class="line" stroke-width="5" d="M112 186q28-28 56-4"/>
    <path class="line" stroke-width="3" d="M113 186l-9-6M118 176l-7-7"/>
  </g>
  <g>
    <ellipse cx="220" cy="188" rx="27" ry="22" fill="#fff"/>
    <circle cx="215" cy="190" r="17" fill="#6b3d22"/>
    <circle cx="215" cy="190" r="9" fill="#24140d"/>
    <circle cx="209" cy="183" r="4.5" fill="#fff"/>
    <circle cx="221" cy="196" r="2" fill="#fff"/>
    <path class="line" stroke-width="5" d="M192 182q28-24 56 4"/>
    <path class="line" stroke-width="3" d="M247 186l9-6M242 176l7-7"/>
  </g>


  <!-- nose + mouth -->
  <path d="M176 212q4 5 8 0" fill="none" stroke="#d29c80" stroke-width="3" stroke-linecap="round"/>
  <path d="M170 232q10 8 20 0" fill="none" stroke="#b5584a" stroke-width="3.5" stroke-linecap="round"/>

  <!-- front hair: crown, straight bangs, layered face-framing strands -->
  <path class="hair" d="M68 178C64 92 118 50 180 50s116 42 112 128c-2 62 8 122 2 162l-6 22-6-24-6 18c-4-56-6-116-10-176-2-16-8-26-16-30q-14 12-28 0-14 12-28 0-14 12-28 0-14 12-28 0-14 12-28 0c-8 4-14 14-16 30-4 60-6 120-10 176l-6-18-6 24-6-22c-6-40 4-100 2-162Z"/>
  <!-- shine -->
  <path d="M118 82q62-26 124 0" fill="none" stroke="#6b4632" stroke-width="7" stroke-linecap="round" opacity=".55"/>

  <!-- hair clip: little blue star -->
  <path d="M252 104l5 11 12 2-9 8 2 12-10-6-11 6 2-12-9-8 12-2Z" fill="#9bbbe8" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
