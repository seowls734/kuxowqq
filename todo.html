<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>나의 할일</title>
<style>
  :root {
    --bg: #f5f6fa;
    --card: #ffffff;
    --text: #1f2330;
    --muted: #8a8fa3;
    --line: #e6e8f0;
    --accent: #4f46e5;
    --danger: #e5484d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141b;
      --card: #1c1f29;
      --text: #eceef5;
      --muted: #8a8fa3;
      --line: #2a2e3b;
      --accent: #7c74ff;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    min-height: 100dvh;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: calc(20px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom));
  }
  header h1 { margin: 0; font-size: 28px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }

  .progress { height: 6px; background: var(--line); border-radius: 99px; margin: 16px 0; overflow: hidden; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }

  .filters { display: flex; gap: 8px; margin-bottom: 12px; }
  .filters button {
    flex: 1; padding: 10px 0; border: 1px solid var(--line); background: var(--card);
    color: var(--muted); border-radius: 12px; font-size: 14px; font-weight: 600;
  }
  .filters button.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  li {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border-radius: 14px; padding: 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .check {
    width: 26px; height: 26px; flex: none; border-radius: 50%;
    border: 2px solid var(--line); background: none; display: grid; place-items: center;
    color: #fff; font-size: 14px; padding: 0;
  }
  li.done .check { background: var(--accent); border-color: var(--accent); }
  .text { flex: 1; font-size: 16px; word-break: break-word; }
  li.done .text { color: var(--muted); text-decoration: line-through; }
  .del {
    border: none; background: none; color: var(--muted); font-size: 20px;
    width: 32px; height: 32px; border-radius: 8px; flex: none;
  }
  .del:active { color: var(--danger); }

  .empty { text-align: center; color: var(--muted); padding: 48px 0; font-size: 15px; }
  .clear { display: block; margin: 16px auto 0; border: none; background: none; color: var(--muted); font-size: 13px; text-decoration: underline; }

  form {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--bg); border-top: 1px solid var(--line);
  }
  form .row { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; }
  form input {
    flex: 1; min-width: 0; padding: 14px 16px; font-size: 16px;
    border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: var(--text); outline: none;
  }
  form input:focus { border-color: var(--accent); }
  form button {
    padding: 0 20px; border: none; border-radius: 14px; background: var(--accent);
    color: #fff; font-size: 16px; font-weight: 700;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>나의 할일</h1>
      <p id="summary"></p>
    </header>
    <div class="progress"><div id="bar"></div></div>
    <div class="filters">
      <button data-f="all" class="on">전체</button>
      <button data-f="active">진행중</button>
      <button data-f="done">완료</button>
    </div>
    <ul id="list"></ul>
    <div class="empty" id="empty" hidden></div>
    <button class="clear" id="clear" hidden>완료한 항목 지우기</button>
  </div>

  <form id="form">
    <div class="row">
      <input id="input" placeholder="할일을 입력하세요" autocomplete="off" maxlength="200">
      <button type="submit">추가</button>
    </div>
  </form>

<script>
  const KEY = 'my-todos';
  let todos = load();
  let filter = 'all';

  const $ = (id) => document.getElementById(id);

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch {}
  }

  function render() {
    const list = $('list');
    list.innerHTML = '';
    const shown = todos.filter(t => filter === 'all' || (filter === 'done' ? t.done : !t.done));

    for (const t of shown) {
      const li = document.createElement('li');
      if (t.done) li.className = 'done';

      const check = document.createElement('button');
      check.className = 'check';
      check.textContent = t.done ? '✓' : '';
      check.setAttribute('aria-label', '완료 표시');
      check.onclick = () => { t.done = !t.done; save(); render(); };

      const text = document.createElement('span');
      text.className = 'text';
      text.textContent = t.text;
      text.ondblclick = () => edit(t);

      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '×';
      del.setAttribute('aria-label', '삭제');
      del.onclick = () => { todos = todos.filter(x => x.id !== t.id); save(); render(); };

      li.append(check, text, del);
      list.append(li);
    }

    const total = todos.length;
    const done = todos.filter(t => t.done).length;
    $('summary').textContent = total ? `${total}개 중 ${done}개 완료` : '오늘도 화이팅!';
    $('bar').style.width = total ? (done / total * 100) + '%' : '0';

    const empty = $('empty');
    empty.hidden = shown.length > 0;
    empty.textContent = filter === 'done' ? '완료한 할일이 없어요' : filter === 'active' ? '모두 끝냈어요 🎉' : '할일을 추가해 보세요';
    $('clear').hidden = done === 0;
  }

  function edit(t) {
    const v = prompt('할일 수정', t.text);
    if (v && v.trim()) { t.text = v.trim(); save(); render(); }
  }

  $('form').onsubmit = (e) => {
    e.preventDefault();
    const v = $('input').value.trim();
    if (!v) return;
    todos.unshift({ id: Date.now() + Math.random(), text: v, done: false });
    $('input').value = '';
    save(); render();
  };

  document.querySelectorAll('.filters button').forEach(b => {
    b.onclick = () => {
      filter = b.dataset.f;
      document.querySelectorAll('.filters button').forEach(x => x.classList.toggle('on', x === b));
      render();
    };
  });

  $('clear').onclick = () => {
    if (confirm('완료한 항목을 모두 지울까요?')) { todos = todos.filter(t => !t.done); save(); render(); }
  };

  render();
</script>
</body>
</html>
